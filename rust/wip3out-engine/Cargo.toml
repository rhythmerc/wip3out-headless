[package]
name = "wip3out-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "WipEout 3 Special Edition's side of the buildAR engine contract: the ship flying free over the room."

[lib]
name = "wip3out_engine"
path = "src/lib.rs"

[dependencies]
# The engine contract (a host pins the same revision).
engine-core = { git = "https://github.com/rhythmerc/buildar-engine-core", rev = "53880bada814385d0c3c96fcd4db808f02de737d" }
# What every headless engine hosts the same way: the game's library loaded and called, the controllers as a pad, the
# world in the game's units and axes, a stand-in model.
buildar-headless-core = { git = "https://github.com/rhythmerc/buildar-headless-core", rev = "74154eec3abebb3359e179d227b97bc0264e0c18" }

[dev-dependencies]
png = "0.18"
